[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-learning-integration"
version = "0.2.0"
description = "Domain-to-KT-to-runtime glue for the local Lumi learning loop"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hermes-integration = "hermes_integration.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_integration*"]
