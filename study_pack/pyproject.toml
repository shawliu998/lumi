[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi-study-pack"
version = "0.1.0"
description = "Local-only, cited Study Pack domain for Lumi"
requires-python = ">=3.11"
dependencies = ["pypdf==6.10.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lumi_study_pack*"]
